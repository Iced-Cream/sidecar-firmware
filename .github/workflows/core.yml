# The engine core's tests on macOS (core/host/um_host.cpp uses Apple's JIT API, so the core's host build is macOS-only for
# now), only when something they build changed.
name: core
on:
  push:
    branches: [main, dev]
    paths:
      - core/**
      - sdk/**
      - teensy/libraries/RytmPlugins/**
      - tools/gen_version.sh
      - .github/workflows/core.yml
  pull_request:
    paths:
      - core/**
      - sdk/**
      - teensy/libraries/RytmPlugins/**
      - tools/gen_version.sh
      - .github/workflows/core.yml
permissions:
  contents: read
jobs:
  core:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Engines (Plaits, DaisySP, digidrum at their pinned commits)
        run: make -C core engines
      - name: Core tests
        run: make -C core test -j3
