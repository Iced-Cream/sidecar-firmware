# The required status check "test": the tests that need no hardware, no firmware and no cross toolchain
# (tools/run_portable_tests.sh), on a Linux runner. The engine core's tests are in core.yml.
name: test
on:
  push:
    branches: [main, dev]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang
      - name: ASan-friendly ASLR (the Pi tests run under ASan/UBSan)
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Portable tests
        run: tools/run_portable_tests.sh
        env:
          CXX: clang++
          CC: clang
