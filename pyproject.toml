[project]
name = "rytm-teensy"
version = "0.1.0"
description = "Teensy 4.1 as an external voice engine for the Analog Rytm MKII: research, the simulated Teensy, tools"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mido>=1.3.3",
    "python-rtmidi>=1.5.8",
    "numpy>=2.0",
    "pyserial>=3.5",
    "soundfile>=0.14.0",
    "scipy>=1.18.1",
]

[tool.uv]
package = false
